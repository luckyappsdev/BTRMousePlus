<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucky Apps</title>
<meta name="description" content="Android and Windows apps by Lucky Apps. Приложения для Android и Windows от Lucky Apps.">
<style>
@font-face{font-family:Manrope;src:url("fonts/Manrope.woff") format("woff");font-weight:200 800;font-style:normal;font-display:swap}
@font-face{font-family:Unbounded;src:url("fonts/Unbounded.woff") format("woff");font-weight:200 900;font-style:normal;font-display:swap}
:root{--bg:#f3f7f2;--card:#fff;--ink:#12352a;--muted:#5b7267;--green:#2f9e5b;--gold:#e8b923;--line:#d7e3da}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;line-height:1.55}
.wrap{max-width:960px;margin:0 auto;padding:24px 20px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-family:Unbounded,Manrope,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;font-weight:700;font-size:1.15rem}
.logo span{color:var(--green)}
.lang{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;padding:6px 14px;font:inherit;font-weight:800;color:var(--ink);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.hero{padding:56px 0 36px}
h1{font-family:Unbounded,Manrope,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;font-weight:700;font-size:clamp(1.9rem,5vw,3rem);line-height:1.15;margin:0 0 14px;max-width:16em}
.hero p{font-size:1.1rem;color:var(--muted);max-width:34em;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px;align-items:start}
.app{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;gap:14px;align-items:center}
.icon{width:64px;height:64px;flex:none;object-fit:contain}
.icon.round{border-radius:15px}
h2{font-family:Unbounded,Manrope,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;font-weight:500;font-size:1.2rem;margin:0}
.tag{display:inline-block;font-size:.8rem;font-weight:800;background:#e7f3ea;color:var(--green);border-radius:8px;padding:1px 8px;margin-top:4px}
.tag.plat{background:#e8eef0;color:var(--ink)}
.tag.dev{background:#fdf3d0;color:#8a6a00}
.desc{margin:0}
ul.feat{margin:10px 0 0;padding-left:1.2em;color:var(--muted)}
ul.feat li{margin:4px 0}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:800;color:var(--green)}
details p{color:var(--muted);margin:8px 0 0;font-size:.95rem}
details p a{color:var(--green);font-weight:800}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:600}
.stars button{border:0;background:none;padding:0 1px;font-size:1.5rem;color:#c9d6cd;cursor:pointer}
.stars button:disabled{cursor:default}
.stars button.on{color:var(--gold)}
.dl{display:block;text-align:center;text-decoration:none;background:var(--ink);color:#fff;font-weight:800;padding:13px 18px;border-radius:14px;border:0;font-size:1rem;font-family:inherit;cursor:pointer}
.dl:hover{background:var(--green)}
.dl2{background:transparent;color:var(--ink);border:2px solid var(--ink);padding:11px 18px}
.dl2:hover{background:var(--ink);color:#fff}
.dl[aria-disabled=true]{background:#c9d6cd;color:#5b7267;pointer-events:none}
.hint{font-size:.88rem;color:var(--muted);margin:0}
.sec{margin-top:30px;background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:6px 24px 20px}
.sec h3{font-family:Unbounded,Manrope,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;font-weight:500;font-size:1.05rem;margin:18px 0 8px}
.sec p{margin:8px 0 0;color:var(--muted);font-size:.95rem}
.sec a{color:var(--green);font-weight:800}
.gal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:12px;background:#eef4ef;border-radius:14px}
.gthumb{flex:none;width:110px;border:0;background:none;padding:0;cursor:zoom-in;scroll-snap-align:start;text-align:center;font:inherit;color:inherit}
.gthumb img{display:block;width:110px;height:auto;border-radius:8px;border:1px solid var(--line)}
.gthumb span{display:block;font-size:.75rem;color:var(--muted);margin-top:4px;line-height:1.25}
#lb{position:fixed;inset:0;z-index:50;background:rgba(10,25,20,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px}
#lb[hidden]{display:none}
#lb img{max-width:92vw;max-height:78vh;width:auto;height:auto;border-radius:10px;background:#fff}
#lb .row{display:flex;align-items:center;gap:14px}
#lb button{border:0;border-radius:999px;background:#fff;color:var(--ink);font-size:1.5rem;line-height:1;width:44px;height:44px;cursor:pointer;font-weight:800}
#lb .x{position:absolute;top:14px;right:14px}
#lb p{color:#fff;margin:0;text-align:center;font-weight:600}
.shots{display:flex;flex-direction:column;gap:14px;background:#eef4ef;border-radius:14px;padding:14px}
.srow{display:flex;gap:12px;align-items:flex-end;justify-content:center}
.srow.rw{flex-wrap:wrap}
.srow.rw figcaption{white-space:nowrap}
.shots figure{margin:0;text-align:center;min-width:0}
.shots img{display:block;width:100%;height:auto;border-radius:10px}
.shots figcaption{font-size:.8rem;color:var(--muted);margin-top:6px}
.hint a{color:var(--green);font-weight:800}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
footer p{margin:4px 0}
footer a{color:var(--green);font-weight:800}
footer{margin-top:44px;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line);padding-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Lucky<span>Apps</span></div>
    <div class="lang" role="group" aria-label="Language">
      <button data-l="ru" aria-pressed="true">RU</button>
      <button data-l="en" aria-pressed="false">EN</button>
    </div>
  </header>
  <section class="hero">
    <h1 data-t="h1"></h1>
    <p data-t="sub"></p>
  </section>
  <main class="grid" id="apps"></main>
  <section class="sec" id="sec"></section>
  <footer><p data-t="ai"></p><p><span data-t="contact"></span> <a href="mailto:luckyapps1975@gmail.com">luckyapps1975@gmail.com</a></p><p><a href="privacy-site.html" data-t="d_site"></a></p><p data-t="foot"></p></footer>
</div>

/* ===== Счётчики скачиваний и оценки (Supabase) =====
   Ключ ниже публичный (publishable): он предназначен для сайтов. Посетитель может только читать числа
   и вызывать две функции базы: прибавить скачивание и поставить оценку 1-5. */
var SB_URL = "https://qmcbsxwdczynfxwenvhs.supabase.co";
var SB_KEY = "sb_publishable__fpKpq1fJUh2er23CJ4i0Q_dGxTRZYI";
var STATS = { app1: { downloads: 0, sum: 0, votes: 0, ok: false }, app2: { downloads: 0, sum: 0, votes: 0, ok: false } };

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function sbRpc(name, body) {
  return fetch(SB_URL + "/rest/v1/rpc/" + name, { method: "POST", headers: { "apikey": SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify(body), keepalive: true })
    .then(function (r) { if (!r.ok) throw new Error(r.status); });
}
function loadStats() {
  fetch(SB_URL + "/rest/v1/app_stats?select=app_id,downloads,rating_sum,rating_votes", { headers: { "apikey": SB_KEY } })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (rows) {
      rows.forEach(function (x) { var st = STATS[x.app_id]; if (st) { st.downloads = +x.downloads; st.sum = +x.rating_sum; st.votes = +x.rating_votes; st.ok = true; } });
      render();
    })
    .catch(function () {});
}
function countDownload(id, file) {
  var key = "dl_" + file, last = +lsGet(key) || 0, now = Date.now();
  if (now - last < 60000) return;
  lsSet(key, now);
  sbRpc("inc_download", { p_app: id }).then(function () { STATS[id].downloads++; render(); }).catch(function () {});
}
function rateApp(id, n) {
  if (lsGet("rated_" + id)) return;
  sbRpc("rate_app", { p_app: id, p_stars: n }).then(function () { lsSet("rated_" + id, n); var st = STATS[id]; st.sum += n; st.votes++; st.fresh = true; render(); }).catch(function () {});
}

var lang = "ru";
try { var s = localStorage.getItem("lang"); if (s) lang = s; else if (!/^ru|uk|be/.test(navigator.language || "")) lang = "en"; } catch (e) {}

function esc(t) { var d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

function render() {
  var T = TEXT[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = T[el.dataset.t]; });
  document.querySelectorAll(".lang button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.l === lang); });

  var sec = document.getElementById("sec");
  sec.innerHTML = "<h3>" + T.sec_h + "</h3>" + T.sec_p.map(function (x) { return "<p>" + x + "</p>"; }).join("");

  var box = document.getElementById("apps");
  var openIds = [];
  box.querySelectorAll("details[open]").forEach(function (d) { openIds.push(d.dataset.a); });
  box.innerHTML = "";
  APPS.forEach(function (a) {
    var st = STATS[a.id], avg = st.votes ? (st.sum / st.votes).toFixed(1) : null;
    var card = document.createElement("article");
    card.className = "app";
    var stars = "";
    var mine = +lsGet("rated_" + a.id) || 0;
    for (var i = 1; i <= 5; i++) stars += '<button type="button" data-a="' + a.id + '" data-s="' + i + '" class="' + (avg && i <= Math.round(avg) ? "on" : "") + '" aria-label="' + i + '"' + (mine ? " disabled" : "") + '>★</button>';
    var feat = a.feat[lang].length ? '<ul class="feat">' + a.feat[lang].map(function (f) { return "<li>" + esc(f) + "</li>"; }).join("") + "</ul>" : "";
    var shots = "";
    if (a.shots && a.shots.length) {
      shots = '<div class="shots">' + a.shots.map(function (row) {
        return '<div class="srow' + (row.wrap ? ' rw' : '') + '">' + row.items.map(function (x) {
          return '<figure style="flex:0 1 ' + x.w + 'px;max-width:' + x.w + 'px"><img src="' + x.src + '" alt="' + esc(x.cap[lang]) + '"><figcaption>' + esc(x.cap[lang]) + '</figcaption></figure>';
        }).join("") + '</div>';
      }).join("") + '</div>';
    }
    var gal = a.gallery ? '<div class="gal" role="group" aria-label="' + esc(T.gal) + '">' + a.gallery.items.map(function (g, i) { return '<button type="button" class="gthumb" data-g="' + a.id + '" data-i="' + i + '"><img src="' + a.gallery.dir + g.n + '-s.webp" width="110" height="226" loading="lazy" decoding="async" alt="' + esc(g.cap[lang]) + '"><span>' + esc(g.cap[lang]) + '</span></button>'; }).join("") + '</div>' : "";
    var dls = a.downloads
      ? '<p class="hint">' + a.dlnote[lang] + '</p>' + a.downloads.map(function (d, i) { return '<a class="dl" data-a="' + a.id + '" href="' + d.href + '">' + d[lang] + '</a>'; }).join("")
      : '<a class="dl" data-a="' + a.id + '" ' + (a.file ? 'href="' + a.file + '"' : 'aria-disabled="true"') + '>' + (a.file ? T["dl_" + a.platform] : T.soon) + '</a>';
    var more = '<details data-a="' + a.id + '"' + (openIds.indexOf(a.id) > -1 ? " open" : "") + '><summary>' + T.more + '</summary>' + feat + a.more[lang].map(function (p) { return Array.isArray(p) ? "<ul class='feat'>" + p.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : "<p>" + esc(p) + "</p>"; }).join("") + (a.docs || [a.doc]).map(function (x) { return '<p><a href="' + x.href + '">' + x[lang] + '</a></p>'; }).join("") + '</details>';
    card.innerHTML =
      '<div class="top"><img class="icon' + (a.round ? " round" : "") + '" src="' + a.icon + '" alt=""><div><h2></h2><span class="tag plat">' + (a.platform === "android" ? "Android" : "Windows") + '</span> <span class="tag ' + a.status + '">' + T[a.status] + '</span></div></div>' +
      '<p class="desc"></p>' + shots + gal + more +
      '<div class="meta"><span>' + (st.ok ? st.downloads : "—") + ' ' + T.downloads + '</span><span>' + (st.ok ? (avg ? "★ " + avg + " (" + st.votes + ")" : T.none) : "—") + '</span></div>' +
      '<div class="stars"><span>' + (mine ? (st.fresh ? T.thanks : T.rated) + " ★" + mine : T.rate) + '</span> ' + stars + '</div>' +
      dls +
      (a.req ? '<p class="hint">' + a.req[lang] + '</p>' : '') + '<p class="hint">' + T["hint_" + a.platform] + '</p>' + '<p class="hint"><strong>' + T.langs + '</strong> ' + esc(a.langs.join(", ")) + '</p>' + (a.ask ? '<p class="hint"><strong>' + esc(a.ask.lead[lang]) + '</strong> ' + esc(a.ask.text[lang]) + '</p>' : '');
    card.querySelector("h2").textContent = a.name[lang];
    card.querySelector(".desc").textContent = a.desc[lang];
    box.appendChild(card);
  });
}

document.addEventListener("click", function (e) {
  var b = e.target.closest("button[data-l]");
  if (b) { lang = b.dataset.l; try { localStorage.setItem("lang", lang); } catch (x) {} render(); return; }
  var s = e.target.closest("button[data-s]");
  if (s) { rateApp(s.dataset.a, +s.dataset.s); return; }
  var d = e.target.closest("a.dl[href]");
  if (d) { countDownload(d.dataset.a, d.getAttribute("href")); }
});

var lb = { id: null, i: 0 };
function lbShow() {
  var a = APPS.filter(function (x) { return x.id === lb.id; })[0];
  var items = a.gallery.items, n = items.length;
  lb.i = (lb.i + n) % n;
  var g = items[lb.i], T = TEXT[lang];
  var img = document.getElementById("lbimg");
  img.src = a.gallery.dir + g.n + ".webp";
  img.alt = g.cap[lang];
  document.getElementById("lbcap").textContent = g.cap[lang] + "  (" + (lb.i + 1) + " / " + n + ")";
  var box = document.getElementById("lb");
  box.querySelector("[data-lb=close]").setAttribute("aria-label", T.lb_close);
  box.querySelector("[data-lb=prev]").setAttribute("aria-label", T.lb_prev);
  box.querySelector("[data-lb=next]").setAttribute("aria-label", T.lb_next);
}
function lbOpen(id, i) { lb.id = id; lb.i = i; lbShow(); document.getElementById("lb").hidden = false; document.querySelector("#lb [data-lb=close]").focus(); }
function lbClose() { document.getElementById("lb").hidden = true; }
document.addEventListener("click", function (e) {
  var t = e.target.closest("button[data-g]");
  if (t) { lbOpen(t.dataset.g, +t.dataset.i); return; }
  var c = e.target.closest("[data-lb]");
  if (c) { if (c.dataset.lb === "close") lbClose(); else { lb.i += c.dataset.lb === "next" ? 1 : -1; lbShow(); } return; }
  if (e.target.id === "lb") lbClose();
});
document.addEventListener("keydown", function (e) {
  if (document.getElementById("lb").hidden) return;
  if (e.key === "Escape") lbClose();
  else if (e.key === "ArrowRight") { lb.i++; lbShow(); }
  else if (e.key === "ArrowLeft") { lb.i--; lbShow(); }
});

render();
loadStats();
</script>
